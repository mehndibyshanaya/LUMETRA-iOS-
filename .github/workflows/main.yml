name: LUMETRA - Build unsigned

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project LUMETRA.xcodeproj \
            -scheme LUMETRA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/LUMETRA.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          /usr/bin/zip -r LUMETRA-unsigned.ipa Payload

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LUMETRA-unsigned-build
          path: |
            build/LUMETRA-unsigned.ipa
            build/DerivedData/Build/Products/Release-iphoneos/LUMETRA.app
          retention-days: 14
